<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tick 支持</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #f5f4ee;
      --text: #151513;
      --muted: #67635a;
      --border: #d9d5c9;
      --accent: #2e7a50;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #11110f;
        --text: #f2efe6;
        --muted: #bbb4a7;
        --border: #333027;
        --accent: #7ed9a5;
      }
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font: 16px/1.72 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    main {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 8vw, 56px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-underline-offset: 4px;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <h1>Tick</h1>
    <p>Tick 是一款音乐播放工具，用拟物化的播放器界面管理 Apple Music、本地资料库和文件音乐。</p>
    <p>如果你遇到问题、希望反馈体验或提出功能建议，可以通过下方邮箱联系我们。</p>

    <div class="links">
      <a href="mailto:xdx_lab@126.com">支持邮箱：xdx_lab@126.com</a>
      <a href="./privacy-policy/">隐私政策</a>
    </div>
  </main>
</body>
</html>
